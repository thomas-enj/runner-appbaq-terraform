name: Deploy and Configure Runner

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to perform"
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - destroy
      confirm_destroy:
        description: "Confirm destruction of the runner infrastructure"
        type: boolean
        required: false
        default: false

concurrency:
  group: runner-terraform-${{ vars.TF_OWNER }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: ./terraform
  ANSIBLE_WORKING_DIR: ./ansible-repo
  RG_NAME: ${{ vars.TF_RGROUP }}
  SA_BACKEND: ${{ vars.TF_SA_BACKEND }}
  TF_VAR_resource_group_name: ${{ vars.TF_RGROUP }}
  TF_VAR_owner: ${{ vars.TF_OWNER }}
  OWNER: ${{ vars.TF_OWNER }}
  NSG_NAME: nsg-runner
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  provision-and-configure:
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate GitHub variables
        shell: bash
        run: |
          if [[ -z "${TF_VAR_resource_group_name//[[:space:]]/}" || -z "${TF_VAR_owner//[[:space:]]/}" || -z "${SA_BACKEND//[[:space:]]/}" ]]; then
            echo "::error::Define the GitHub repository variables TF_RGROUP, TF_OWNER and TF_SA_BACKEND."
            exit 1
          fi

      - name: Checkout Terraform repository
        uses: actions/checkout@v7.0.1

      - name: Checkout Ansible repository
        uses: actions/checkout@v7.0.1
        with:
          repository: thomas-enj/runner-appbaq-ansible
          path: ansible-repo

      - name: Azure Login via OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${RG_NAME}" \
            -backend-config="storage_account_name=${SA_BACKEND}" \
            -backend-config="container_name=tfstate-appbaq" \
            -backend-config="key=${OWNER}.runner.terraform.tfstate" \
            -backend-config="use_azuread_auth=true"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="admin_ip=${{ secrets.MY_ADMIN_IP }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Get Terraform Outputs
        id: tf-outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "RUNNER_IP=$(terraform output -raw runner_public_ip)" >> "$GITHUB_ENV"
          terraform output -raw runner_ssh_private_key > runner_key.pem
          chmod 600 runner_key.pem

      - name: Get GitHub Actions IP
        run: |
          ACTION_IP=$(curl -s https://api.ipify.org)
          echo "ACTION_IP=$ACTION_IP" >> $GITHUB_ENV

      - name: Open Temporary Firewall Rule
        id: firewall
        run: |
          az network nsg rule create \
            --resource-group "$RG_NAME" \
            --nsg-name ${{ env.NSG_NAME }} \
            --name Allow-GitHub-Actions \
            --priority 110 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --source-port-range "*" \
            --destination-port-range 22 \
            --source-address-prefix ${{ env.ACTION_IP }}/32 \
            --destination-address-prefix "*"

      - name: Generate GitHub Runner Registration Token
        run: |
          TOKEN=$(curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_GITHUB }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/thomas-enj/appbaq-infra-terraform/actions/runners/registration-token | jq -r .token)
          echo "RUNNER_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Trust Runner SSH Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.RUNNER_IP }} >> ~/.ssh/known_hosts

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i "${{ env.RUNNER_IP }}," playbook.yml \
            -u azureuser --private-key "$GITHUB_WORKSPACE/$TF_WORKING_DIR/runner_key.pem" \
            -e "runner_setup_github_token=${{ env.RUNNER_TOKEN }}"
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}

      - name: Close Temporary Firewall Rule
        if: ${{ always() && (steps.firewall.outcome == 'success' || steps.firewall.outcome == 'failure') }}
        run: |
          az network nsg rule delete \
            --resource-group "$RG_NAME" \
            --nsg-name ${{ env.NSG_NAME }} \
            --name Allow-GitHub-Actions

  destroy:
    if: ${{ inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    env:
      TF_VAR_admin_ip: ${{ secrets.MY_ADMIN_IP }}
    steps:
      - name: Validate destruction request
        shell: bash
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [[ "$CONFIRM_DESTROY" != "true" ]]; then
            echo "::error::Enable confirm_destroy to destroy the runner infrastructure."
            exit 1
          fi
          if [[ -z "${TF_VAR_resource_group_name//[[:space:]]/}" || -z "${TF_VAR_owner//[[:space:]]/}" || -z "${SA_BACKEND//[[:space:]]/}" || -z "${TF_VAR_admin_ip//[[:space:]]/}" ]]; then
            echo "::error::Define TF_RGROUP, TF_OWNER, TF_SA_BACKEND and the MY_ADMIN_IP secret."
            exit 1
          fi

      - name: Checkout Terraform repository
        uses: actions/checkout@v7.0.1

      - name: Azure Login via OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${RG_NAME}" \
            -backend-config="storage_account_name=${SA_BACKEND}" \
            -backend-config="container_name=tfstate-appbaq" \
            -backend-config="key=${OWNER}.runner.terraform.tfstate" \
            -backend-config="use_azuread_auth=true"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}